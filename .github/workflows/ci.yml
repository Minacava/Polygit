name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production audit
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        # Expand the file list with find: quoted globs like 'test/**/*.test.js'
        # are not expanded on Linux Node 20 in Actions (works on macOS Node 22).
        run: npm run build && node --test --experimental-test-coverage $(find test -name '*.test.js' | sort)
