name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production audit
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # List files with find: quoted 'test/**/*.test.js' is not expanded on
        # Linux Node 20 in Actions. Skip --experimental-test-coverage here —
        # on Node 20 it can exit 1 after all tests pass (coverage reporter bug).
        run: npm test
